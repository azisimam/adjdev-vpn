name: Build APK

# Builds a debug APK on every push/PR to main, or on demand via the
# "Run workflow" button (workflow_dispatch). The finished APK is attached
# to the run as a downloadable artifact - see the "Actions" tab on GitHub,
# click the run, and look under "Artifacts" at the bottom of the summary
# page.
#
# Uses gradle/actions/setup-gradle to run Gradle directly, so this does
# NOT need gradlew / gradle-wrapper.jar to be committed to the repo (they
# aren't, on purpose - see the root README).

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AILiveBear-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
