name: Move Android Project to Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move project to root
        run: |
          shopt -s dotglob

          for item in ADJDEV-VPN/*; do
            name=$(basename "$item")

            if [ "$name" != ".github" ]; then
              cp -r "$item" .
            fi
          done

          rm -rf ADJDEV-VPN
          rm -f ADJDEV-VPN.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Move Android project to repository root" || echo "No changes"
          git push
