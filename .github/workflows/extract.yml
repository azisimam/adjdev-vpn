name: Extract ZIP to Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP to root
        run: |
          unzip -o ADJDEV-VPN.zip -d extracted

          cp -r extracted/* .
          cp -r extracted/.[!.]* . 2>/dev/null || true

          rm -rf extracted

      - name: Remove ZIP
        run: rm -f ADJDEV-VPN.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Extract ADJDEV-VPN to root" || echo "No changes"
          git push
