name: Extract ADJDEV-VPN

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p ADJDEV-VPN
          unzip -o ADJDEV-VPN.zip -d ADJDEV-VPN

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ADJDEV-VPN
          git commit -m "Extract ADJDEV-VPN.zip" || echo "No changes to commit"
          git push
